---
title: My Projects
layout: default
---

<div class="container my-3">

	<div class="vstack gap-4 col-md-8 mx-auto">

		<h3>Projects</h3>

		{% for project in site.data.projects %}

			<div class="card shadow">
				<h5 class="card-header" style="font-weight: 800;">
					{{ project.title }}
				</h5>
				<div class="row g-0">
					<div class="col-3">
						<img src="{{ project.imageUrl }}" class="img-fluid rounded-start" alt="...">
					</div>
					<div class="col-9">
						<div class="card-body" style="min-height: 180px;">
							<h5 class="card-title">
								{{ project.role }}
							</h5>
							<p class="card-text">
								{{ project.description }}
							</p>
							<a href="{{ project.projectUrl }}" target="_blank" class="btn btn-primary btn-sm">
								Check it out
							</a>
						</div>
					</div>
				</div>
			</div>

		{% endfor %}

	</div>

</div>
